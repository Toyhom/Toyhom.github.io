en:
  core_title: "Human-like Role-Playing Agents"
  core_body: "I study how LLM agents can reason, remember roles, stay safe, and interact as believable characters."
  outcome: "Goal: turn LLM agents from generic tools into personalized, reliable interactive partners."
  pillars:
    - title: "Persona & Memory"
      body: "Model character traits, dialogue history, and personalized behavior."
      tag: "Who the agent is"
    - title: "Role-Aware Reasoning"
      body: "Teach agents to think and act consistently with their assigned roles."
      tag: "How it thinks"
    - title: "Safety & Robustness"
      body: "Analyze hallucination, jailbreak risks, and safety-utility trade-offs."
      tag: "When it fails"
    - title: "Evaluation & Applications"
      body: "Build benchmarks, surveys, and industry-agent practices for real use."
      tag: "Where it works"

zh:
  core_title: "拟人化角色扮演智能体"
  core_body: "我研究如何让 LLM 智能体具备角色记忆、角色一致推理、安全鲁棒性和可信交互能力。"
  outcome: "目标：让智能体从通用工具进化为更个性化、更可靠的交互伙伴。"
  pillars:
    - title: "个性与记忆"
      body: "建模角色特征、对话历史和个性化行为。"
      tag: "它是谁"
    - title: "角色感知推理"
      body: "让智能体按照角色身份进行一致的思考与行动。"
      tag: "它怎么想"
    - title: "安全与鲁棒性"
      body: "研究幻觉、越狱风险，以及安全性与有用性的权衡。"
      tag: "它何时失效"
    - title: "评测与应用"
      body: "构建评测基准、综述和行业智能体实践。"
      tag: "它能做什么"
